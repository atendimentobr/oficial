	<style>
		body {
			background-color: #000; /* Black background */
		}
		.button-container {
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh; /* Make the container take up the full height of the page */
		}
		.button {
			background-color: #ff0000; /* Red button */
			color: #fff; /* White text */
			padding: 20px 40px; /* Increased padding to make the button larger */
			font-size: 24px; /* Increased font size to make the button larger */
			border: none;
			border-radius: 10px; /* Increased border radius to make the button larger */
			cursor: pointer;
			animation: pulse 2s infinite; /* Add pulsing effect */
		}
		.button:hover {
			background-color: #cc0000; /* Darker red on hover */
		}
		@keyframes pulse {
			0% {
				transform: scale(1);
			}
			50% {
				transform: scale(1.1);
			}
			100% {
				transform: scale(1);
			}
		}
	</style>
